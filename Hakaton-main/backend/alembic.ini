# Миграции структуры базы (Alembic). Адрес базы берётся из настроек приложения (SK_DATABASE_URL), а не отсюда.
# Сервер при запуске сам применяет недостающие миграции; вручную команды нужны, когда меняются модели:
#   uv run alembic revision --autogenerate -m "что поменялось"   — новая миграция по изменениям в app/models.py
#   uv run alembic upgrade head                                  — довести базу до последней миграции
#   uv run alembic downgrade -1                                  — откатить последнюю миграцию

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

# новые файлы миграций сразу приводятся к стилю проекта
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
