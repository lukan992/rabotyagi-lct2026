server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 15m;  # загрузка фото на проверку

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Данные и кадры с камер отдаёт бэкенд. Маркер HLS-проверки назначает только
    # internal subrequest ниже: внешний клиент не может подменить его через /api/.
    location = /api/video/hls-auth { return 403; }
    location /api/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
        proxy_set_header X-HLS-Auth-Request "";
        proxy_set_header X-Original-URI "";
        proxy_read_timeout 60s;
    }
    # рамки техники в реальном времени — WebSocket: соединение живёт, пока открыт экран с камерами
    location = /api/tracks {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location /media/ { proxy_pass http://backend:8100; expires 7d; }

    # HLS остаётся внутри кластера: браузер ходит только на этот same-origin HTTPS путь.
    # MediaMTX привязывает часть ресурсов к session=, поэтому проверяем bearer и камеру
    # на каждом manifest, part и segment, а не только на первом запросе к шлюзу.
    location /hls/ {
        auth_request /_hls_authorize;
        access_log off;  # MediaMTX session UUID и bearer не должны попадать в access log.
        proxy_pass http://video:8888/;
        proxy_redirect / https://$host/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store" always;
        add_header Pragma "no-cache" always;
    }

    # У этого пути нет публичного маршрута. Он передаёт исходный URI только узкому
    # backend-решению; туда не попадают заголовки forwarding от клиента и тело запроса.
    location = /_hls_authorize {
        internal;
        access_log off;
        proxy_pass http://backend:8100/api/video/hls-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host backend;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-HLS-Auth-Request "1";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }  # одностраничное приложение
    # index.html не кэшируем: после обновления браузер сразу получает ссылки на новые файлы /assets/,
    # иначе открытая вкладка просит старые файлы, которых уже нет
    location = /index.html { add_header Cache-Control "no-cache"; }
}
