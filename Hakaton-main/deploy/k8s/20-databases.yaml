apiVersion: v1
kind: Service
metadata:
  name: site-db
  namespace: construction
  labels:
    app.kubernetes.io/name: site-db
    app.kubernetes.io/part-of: stroykontrol
spec:
  selector:
    app.kubernetes.io/name: site-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-db
  namespace: construction
  labels:
    app.kubernetes.io/name: site-db
    app.kubernetes.io/part-of: stroykontrol
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: site-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site-db
        app.kubernetes.io/part-of: stroykontrol
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-k8s-worker-01
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: stroykontrol
            - name: POSTGRES_USER
              value: stroykontrol
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: site-db-password
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: site-db-data
---
