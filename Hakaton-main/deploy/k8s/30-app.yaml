apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: construction
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: stroykontrol
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: stroykontrol
    spec:
      nodeSelector:
        kubernetes.io/hostname: graviton4
      imagePullSecrets:
        - name: registry-pull
      containers:
        - name: backend
          image: construction.g-309.ru/stroykontrol/backend:20260928-hls-auth
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: SK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: site-runtime
                  key: SK_DATABASE_URL
            - name: SK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: site-runtime
                  key: SK_SECRET_KEY
            - name: SK_DEMO_MODE
              value: "false"
            - name: SK_SEED_ON_START
              value: "false"
            - name: SK_KEYCLOAK_ISSUER
              value: https://construction.g-309.ru/auth/realms/stroykontrol
            - name: SK_KEYCLOAK_BACKCHANNEL_URL
              value: http://keycloak:8080/auth
            - name: SK_KEYCLOAK_CLIENT_ID
              value: stroykontrol-web
            - name: SK_KEYCLOAK_AUTO_PROVISION
              value: "true"
            - name: SK_KEYCLOAK_ADMIN_CLIENT_ID
              value: stroykontrol-backend
            - name: SK_KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: site-runtime
                  key: SK_KEYCLOAK_ADMIN_CLIENT_SECRET
            - name: SK_CORS_ORIGINS
              value: https://construction.g-309.ru
            - name: SK_VIDEO_API_URL
              value: http://video:9997
            - name: SK_VIDEO_RTSP_URL
              value: rtsp://video:8554
            - name: SK_VIDEO_WEBRTC_URL
              value: https://construction.g-309.ru
            - name: SK_FRAME_INTERVAL_S
              value: "2"
            - name: SK_CHECK_INTERVAL_S
              value: "60"
            - name: SK_ANALYSIS_PROVIDER
              value: push
            - name: SK_TRACKER_URL
              value: ws://tracker:8200/stream
            - name: SK_TRACKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: site-runtime
                  key: SK_TRACKER_API_KEY
            - name: SK_TRACKER_RTSP_URL
              value: rtsp://video:8554
            - name: SK_TRACKER_VIDEO_DELAY_MS
              value: "150"
            - name: SK_EQUIPMENT_OBSERVATION_TIMEOUT_SECONDS
              value: "90"
            - name: DETERMINISTIC_SERVICE_URL
              value: http://analytics-deterministic:8000
            - name: VLM_LLM_SERVICE_URL
              value: http://analytics-vlm:8000
            - name: ANALYTICS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: site-runtime
                  key: ANALYTICS_SERVICE_TOKEN
            - name: ANALYTICS_HTTP_TIMEOUT_SECONDS
              value: "1020"
            - name: SK_ANALYTICS_INTERVAL_MIN
              value: "20"
            - name: SK_ANALYTICS_VLM_INTERVAL_MIN
              value: "60"
            - name: CAMERA_STAGE_MONITOR_URL
              valueFrom:
                secretKeyRef:
                  name: site-runtime
                  key: CAMERA_STAGE_MONITOR_URL
            - name: CAMERA_STAGE_MONITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: site-runtime
                  key: CAMERA_STAGE_MONITOR_TOKEN
          volumeMounts:
            - name: media
              mountPath: /app/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /api/meta
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/meta
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 4
            failureThreshold: 6
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: site-media
