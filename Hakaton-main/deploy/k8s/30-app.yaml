apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: construction
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: stroykontrol
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: stroykontrol
