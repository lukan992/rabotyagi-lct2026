apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-bootstrap
  namespace: construction
  labels:
    app.kubernetes.io/name: analytics-bootstrap
    app.kubernetes.io/part-of: stroykontrol
  annotations:
    stroykontrol.g-309.ru/run-only-if-analytics-restore-not-verified: "true"
spec:
  suspend: true
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-bootstrap
        app.kubernetes.io/part-of: stroykontrol
    spec:
      nodeSelector:
        kubernetes.io/hostname: graviton4
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-pull
      containers:
        - name: bootstrap
          image: construction.g-309.ru/stroykontrol/bootstrap:20260928
          imagePullPolicy: IfNotPresent
          args: [bootstrap, --matrix, /references/matrix_v2.json, --profiles, /references/visual_work_profiles.sqlite3]
          env:
            - name: POSTGRES_HOST
              value: analytics-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: construction_stages
            - name: POSTGRES_USER
              value: construction_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-runtime
                  key: POSTGRES_PASSWORD
            - name: ANALYTICS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: analytics-runtime
                  key: ANALYTICS_SERVICE_TOKEN
            - name: ANALYTICS_MATRIX_VERSION
              value: construction-class-matrix-v2.0
            - name: ANALYTICS_PROFILES_VERSION
              value: visual-profiles-708cb01523c740f39b8789aa
            - name: ANALYTICS_MAX_CONCURRENCY
              value: "1"
            - name: ANALYTICS_MODEL_TIMEOUT_SECONDS
              value: "240"
            - name: ANALYTICS_EXECUTION_TIMEOUT_SECONDS
              value: "1020"
            - name: ANALYTICS_DETERMINISTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-runtime
                  key: ANALYTICS_DETERMINISTIC_DB_PASSWORD
            - name: ANALYTICS_VLM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-runtime
                  key: ANALYTICS_VLM_DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
