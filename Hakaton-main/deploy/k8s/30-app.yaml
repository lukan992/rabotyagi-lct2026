apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: construction
  labels:
    app.kubernetes.io/name: video
    app.kubernetes.io/part-of: stroykontrol
data:
  mediamtx.yml: |
    logLevel: info
    logDestinations: [stdout]
    api: yes
    apiAddress: 127.0.0.1:9997
    rtsp: yes
    rtspAddress: :8554
    rtspTransports: [tcp]
    webrtc: yes
    webrtcAddress: :8889
    webrtcAllowOrigins: ['*']
    webrtcLocalUDPAddress: :8189
    webrtcLocalTCPAddress: ''
    rtmp: no
    hls: yes
    hlsAddress: :8888
    hlsAllowOrigins: []
    hlsVariant: fmp4
    srt: no
    moq: no
    authMethod: http
    authHTTPAddress: http://backend:8100/api/video/auth
    authHTTPExclude:
      - action: api
      - action: metrics
      - action: pprof
    paths:
      all_others:
---
apiVersion: v1
kind: Service
metadata:
  name: video
  namespace: construction
  labels:
    app.kubernetes.io/name: video
    app.kubernetes.io/part-of: stroykontrol
spec:
  selector:
    app.kubernetes.io/name: video
  ports:
    - name: webrtc
      port: 8889
      targetPort: webrtc
    - name: rtsp
      port: 8554
      targetPort: rtsp
    - name: api
      port: 9997
      targetPort: api
    - name: hls
      port: 8888
      targetPort: hls
    - name: webrtc-udp
      protocol: UDP
      port: 8189
      targetPort: webrtc-udp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video
  namespace: construction
  labels:
    app.kubernetes.io/name: video
    app.kubernetes.io/part-of: stroykontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video
        app.kubernetes.io/part-of: stroykontrol
    spec:
      nodeSelector:
        kubernetes.io/hostname: graviton5
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.21.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtsp
              containerPort: 8554
            - name: webrtc
              containerPort: 8889
            - name: api
              containerPort: 9997
            - name: hls
              containerPort: 8888
            - name: webrtc-udp
              containerPort: 8189
              protocol: UDP
          env:
            - name: MTX_APIADDRESS
              value: :9997
            - name: MTX_AUTHHTTPADDRESS
              value: http://backend:8100/api/video/auth
            - name: MTX_WEBRTCADDITIONALHOSTS
              value: construction.g-309.ru
            - name: MTX_WEBRTCLOCALUDPADDRESS
              value: :8189
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: webrtc
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
---
