apiVersion: v1
kind: Namespace
metadata:
  name: construction
  labels:
    app.kubernetes.io/part-of: stroykontrol
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: construction-registry-data
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry-storage
    app.kubernetes.io/part-of: stroykontrol
spec:
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /var/lib/stroykontrol/registry
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vm-k8s-worker-01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: construction
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry-storage
    app.kubernetes.io/part-of: stroykontrol
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  storageClassName: ""
  volumeName: construction-registry-data
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: construction
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: stroykontrol
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
      app.kubernetes.io/component: registry
      app.kubernetes.io/part-of: stroykontrol
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/component: registry
        app.kubernetes.io/part-of: stroykontrol
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-k8s-worker-01
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          env:
            - name: REGISTRY_HTTP_ADDR
              value: :5000
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: StroyKontrol Registry
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: registry
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: auth
          secret:
            secretName: registry-auth
            defaultMode: 0440
            items:
              - key: htpasswd
                path: htpasswd
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: construction
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: stroykontrol
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: stroykontrol
  ports:
    - name: registry
      protocol: TCP
      port: 5000
      targetPort: registry
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: construction
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: stroykontrol
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - construction.g-309.ru
      secretName: construction-tls
  rules:
    - host: construction.g-309.ru
      http:
        paths:
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  name: registry
