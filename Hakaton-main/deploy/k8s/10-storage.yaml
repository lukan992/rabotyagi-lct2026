apiVersion: v1
kind: PersistentVolume
metadata:
  name: stroykontrol-site-db-pv
  labels:
    app.kubernetes.io/part-of: stroykontrol
    app.kubernetes.io/component: database
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /var/lib/stroykontrol/site-postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [vm-k8s-worker-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: site-db-data
  namespace: construction
  labels:
    app.kubernetes.io/part-of: stroykontrol
    app.kubernetes.io/component: database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
  storageClassName: ""
  volumeName: stroykontrol-site-db-pv
---
