# Clean local Keycloak for the site compose. Render generated/realm.json before starting.
# Usage: docker compose --env-file infra/keycloak/clean.env -f infra/keycloak/compose.clean.yml up -d
name: stroykontrol-keycloak-clean

services:
  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Set it in infra/keycloak/clean.env}
    volumes:
      - keycloak-clean-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set it in infra/keycloak/clean.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set it in infra/keycloak/clean.env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./generated/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - default
      - site

volumes:
  keycloak-clean-db:
    name: stroykontrol-keycloak-clean-db

networks:
  site:
    external: true
    name: hakaton-main_default
